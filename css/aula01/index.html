<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascading Stylesheet</title>
    <style>
        p{
            font-size: 50px;color: blueviolet;
        }
        #gato{
            color: rgb(229, 62, 62); font-size: 200px;
        }
    </style>
</head>
<body>
    <!-- CSS inline é aquele que vai dentro da própria tag -->
    <p style="color: rgb(0, 116, 54); font-size: 60px;">Vitor</p>
    <p id="cahorro"> Quezia </p>
    <p id="gato">Francisco</p>
</body>
</html>
