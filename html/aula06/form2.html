<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2 - Radio e Checkbox</title>
</head>
<body>
    <header>
    </header>
        <main>
            <form action="">
            
            <label for="email">Insira seu e-mail:</label>
            <input type="email" name="email" id="email" required="true" placeholder="João123@gmail.com">

            <br>

            <label for="nome">Insira seu nome:</label>
            <input type="text" name="nome" id="nome" required="true" maxlength="100" placeholder="João da Silva">
            
            <br>
            
            <label for="color">Escolha uma cor:</label>
            <input type="color" name="color" id="color">    
            
            <br>

            <label for="">Avalie o atendimento</label>
            
            <br>

                <input type="radio" name="estrelas" id="3estrelas" value="3">
                <label for="3estrelas">⭐⭐⭐</label>
                <br>

                <input type="radio" name="estrelas" id="2estrelas" value="2">
                <label for="2estrelas">⭐⭐</label>
                <br>

                <input type="radio" name="estrelas" id="1estrela" value="1">
                <label for="1estrela">⭐</label>
            
            <br>

            <label for="">Deixe um comentário:</label>
            <br>
            <textarea name="" id="comentario" cols="30" rows="10" placeholder="Faça seu comentário aqui"></textarea>
            
            <br>
            <input type="submit" value="Enviar!">
            
        </form>
        </main>
    <footer>
    </footer>
</body>
</html>
